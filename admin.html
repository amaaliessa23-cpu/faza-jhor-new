<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CR7 - لوحة التحكم والإدارة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Tajawal', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          boxShadow: {
            'credit-card': '0 20px 40px -15px rgba(0,0,0,0.5)',
            'card-elevated': '0 10px 30px -5px rgba(0,0,0,0.08)',
            'panel': '0 1px 3px rgba(0,0,0,0.05)'
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Tajawal', sans-serif;
      user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.6);
    }
    @keyframes spinPulse {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-[#f8f9fb] text-gray-900 antialiased overflow-hidden">
  <div id="root">
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Tajawal', sans-serif;" dir="rtl">
      <div style="width: 48px; height: 48px; border: 4px solid #e5e7eb; border-top-color: #c9a227; border-radius: 50%; animation: spinPulse 0.7s linear infinite; margin-bottom: 16px;"></div>
      <p style="font-weight: 800; color: #111827; margin: 0; font-size: 17px;">فزعة - لوحة التحكم والإدارة</p>
      <p style="font-size: 13px; color: #6b7280; margin-top: 6px;">جاري فتح لوحة التحكم والاتصال الفوري بقاعدة البيانات...</p>
    </div>
  </div>

  <!-- Local and CDN Fallback Scripts -->
  <script src="/react.production.min.js"></script>

  <script src="/recharts.js"></script>
  <script src="/dashboard-bundle.js"></script>

</html>
